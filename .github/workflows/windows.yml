name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build Windows x64 executables
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package executables and notices
        run: |
          New-Item -ItemType Directory -Path dist/package -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/slx_viewer_desktop.exe dist/package/
          Copy-Item target/x86_64-pc-windows-msvc/release/slx_viewer.exe dist/package/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/slx_viewer-windows-x64.zip
          $hash = (Get-FileHash dist/slx_viewer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  slx_viewer-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: slx_viewer-windows-x64
          path: |
            dist/slx_viewer-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slx_viewer-windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/slx_viewer-windows-x64.zip dist/SHA256SUMS.txt --verify-tag --title "SLX Viewer $RELEASE_TAG" --generate-notes
